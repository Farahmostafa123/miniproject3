version: '3.8'

services:

  # ── Spark Master + JupyterLab ─────────────────────────────────────────────
  spark-master:
    build: .
    container_name: spark-master
    hostname: spark-master
    command: >
      /bin/bash -c "
        /opt/spark/sbin/start-master.sh &&
        jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
        --ServerApp.token='' --ServerApp.password=''
        --ServerApp.allow_origin='*' --ServerApp.disable_check_xsrf=True
      "
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master port (workers connect here)
      - "8888:8888"   # JupyterLab
      - "4040:4040"   # Spark Application UI
    volumes:
      - .:/app
      - ./data:/data
    environment:
      - SPARK_LOCAL_IP=spark-master
      - SPARK_MASTER_HOST=spark-master
    networks:
      - bigdata-net

  # ── Spark Worker 1 ────────────────────────────────────────────────────────
  spark-worker-1:
    build: .
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8081:8081"   # Worker Web UI
    volumes:
      - .:/app
      - ./data:/data
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
      - SPARK_LOCAL_IP=spark-worker-1
    networks:
      - bigdata-net

  # ── Spark Worker 2 ────────────────────────────────────────────────────────
  spark-worker-2:
    build: .
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8082:8081"   # Worker Web UI (mapped to 8082 on host)
    volumes:
      - .:/app
      - ./data:/data
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
      - SPARK_LOCAL_IP=spark-worker-2
    networks:
      - bigdata-net

  # ── Zookeeper ─────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bigdata-net

  # ── Kafka Broker ──────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # PLAINTEXT_HOST allows connections from outside Docker (host machine)
      # PLAINTEXT allows internal Docker network connections
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 2          # 2 partitions: one per user segment
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - .:/app
      - ./data:/data
    networks:
      - bigdata-net

  # ── Dashboard API (Flask) ──────────────────────────────────────────────────
  dashboard-api:
    build: .
    container_name: dashboard-api
    hostname: dashboard-api
    command: python /app/dashboard/api_server.py
    depends_on:
      - kafka
      - spark-master
    ports:
      - "5050:5050"   # REST API for dashboard
    volumes:
      - .:/app
      - ./data:/data
    networks:
      - bigdata-net

networks:
  bigdata-net:
    driver: bridge
